[file:iodef.xml]
source=$ROSE_SUITE_DIR/app/lfric_atm/file/iodef_gal_clim_chem_coarse_aero.xml

[namelist:files]
# chemistry's start_dump_filename only has a pre-built dump at C12 - point the
# new coarse_start_dump_* vars at it directly (hardcoded, not ${RESOLUTION})
coarse_start_dump_directory='$BIG_DATA_DIR/start_dumps/basic-gal/yak'
coarse_start_dump_filename='basic-gal_chem_N96L70_C12L70'
# main dump must stay the regular (non-chem) C48_MG dump - chemistry's own
# "_chem" filename pattern only exists at C12, no C48/C48_MG version exists
start_dump_filename='basic-gal_N96L70_${RESOLUTION}L70'
